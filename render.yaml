services:
  - type: web
    name: smartbiz-ai
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn SmartBizAI.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: smartbiz-ai-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"

databases:
  - name: smartbiz-ai-db
    databaseName: smartbiz_ai
    user: smartbiz_user
    plan: free
